server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the Gateway (for local/testing if not using Istio)
    # location /api {
    #     proxy_pass http://istio-ingressgateway.istio-system.svc.cluster.local;
    # }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
    }
}
