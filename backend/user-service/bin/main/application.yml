spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://postgresql.mbd-infra.svc.cluster.local:5432/mbd
    username: mbdadmin
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

logging:
  level:
    com.mbd: DEBUG
