spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://postgresql.mbd-infra.svc.cluster.local:5432/mbd
    username: mbdadmin
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: admin_service_flyway_history

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.mbd.local/realms/mbd
          jwk-set-uri: http://keycloak.mbd-infra.svc.cluster.local:8080/realms/mbd/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: kafka.mbd-infra.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080

logging:
  level:
    com.mbd: DEBUG
