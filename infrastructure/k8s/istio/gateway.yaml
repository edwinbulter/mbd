apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: mbd-gateway
  namespace: mbd
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "customer.mbd.local"
        - "admin.mbd.local"
        - "keycloak.mbd.local"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: mbd-tls-secret
      hosts:
        - "customer.mbd.local"
        - "admin.mbd.local"
        - "keycloak.mbd.local"
