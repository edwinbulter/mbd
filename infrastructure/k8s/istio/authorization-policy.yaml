apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-access-policy
  namespace: mbd
spec:
  # General policy for all backend services
  action: ALLOW
  rules:
    # Allow service-to-service traffic within the namespace (no JWT needed)
    - from:
        - source:
            principals: ["cluster.local/ns/mbd/*"]
      to:
        - operation:
            paths: ["/api/*"]
    # Allow external requests with valid JWT
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            paths: ["/api/users", "/api/users/*", "/api/accounts", "/api/accounts/*", "/api/funds", "/api/funds/*", "/api/portfolio", "/api/portfolio/*"]
    # Allow Swagger UI and OpenAPI spec access without JWT
    - to:
        - operation:
            paths: ["/swagger-ui/*", "/v3/api-docs/*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: admin-service-policy
  namespace: mbd
spec:
  selector:
    matchLabels:
      app: admin-service
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            paths: ["/api/admin", "/api/admin/*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: customer-frontend-public
  namespace: mbd
spec:
  selector:
    matchLabels:
      app: customer-frontend
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: admin-frontend-public
  namespace: mbd
spec:
  selector:
    matchLabels:
      app: admin-frontend
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/*"]

