apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: portfolio-service
  namespace: mbd
spec:
  hosts:
    - "*"
  gateways:
    - mbd/mbd-gateway
  http:
    - match:
        - uri:
            prefix: /api/portfolio
      route:
        - destination:
            host: portfolio-service
            port:
              number: 8080
