# Istio Rate Limiting Configuration using EnvoyFilter
# Implements token bucket algorithm for all backend services
# Prevents DoS attacks, brute force attempts, and API abuse

---
# Account Service Rate Limiting
# Protects financial endpoints from abuse
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: account-service-rate-limit
  namespace: mbd
spec:
  workloadSelector:
    labels:
      app: account-service
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter
          token_bucket:
            max_tokens: 100          # Maximum burst size
            tokens_per_fill: 100     # Tokens added per interval
            fill_interval: 60s       # Refill every 60 seconds
          filter_enabled:
            runtime_key: local_rate_limit_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            runtime_key: local_rate_limit_enforced
            default_value:
              numerator: 100
              denominator: HUNDRED
          response_headers_to_add:
          - append: false
            header:
              key: x-local-rate-limit
              value: 'true'
          status:
            code: 429

