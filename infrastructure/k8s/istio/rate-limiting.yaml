# Istio Rate Limiting Configuration using EnvoyFilter
# Implements per-user token bucket algorithm for all backend services
# Extracts user ID from JWT token payload (via Istio metadata)
# Prevents DoS attacks, brute force attempts, and API abuse

# NOTE: This configuration uses descriptor-based rate limiting where each user
# gets their own token bucket. User ID is extracted from JWT metadata that
# Istio populates after JWT validation.

---
# Account Service Rate Limiting (Per-User)
# Protects financial endpoints from abuse
# Limit: 100 requests per minute per user
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: account-service-rate-limit
  namespace: mbd
spec:
  workloadSelector:
    labels:
      app: account-service
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter_account
          # Per-user token bucket
          token_bucket:
            max_tokens: 100
            tokens_per_fill: 100
            fill_interval: 60s
          filter_enabled:
            runtime_key: local_rate_limit_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            runtime_key: local_rate_limit_enforced
            default_value:
              numerator: 100
              denominator: HUNDRED
          response_headers_to_add:
          - append: false
            header:
              key: x-local-rate-limit
              value: 'true'
          - append: false
            header:
              key: x-ratelimit-limit
              value: '100'
          - append: false
            header:
              key: x-ratelimit-remaining
              value: '%DYNAMIC_METADATA(envoy.filters.http.local_ratelimit:token_bucket_remaining)%'
          status:
            code: 429
          # Descriptor-based rate limiting (per user from JWT metadata)
          descriptors:
          - entries:
            - key: user_id
              value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:sub)%"
            token_bucket:
              max_tokens: 100
              tokens_per_fill: 100
              fill_interval: 60s

