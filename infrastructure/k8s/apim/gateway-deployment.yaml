apiVersion: apps/v1
kind: Deployment
metadata:
  name: apim-gateway
  namespace: mbd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apim-gateway
  template:
    metadata:
      labels:
        app: apim-gateway
    spec:
      containers:
        - name: apim-gateway
          image: mcr.microsoft.com/azure-api-management/gateway:latest
          env:
            - name: config.service.endpoint
              value: "https://$APIM_NAME.management.azure-api.net"
            - name: config.service.auth
              valueFrom:
                secretKeyRef:
                  name: apim-gateway-token
                  key: gateway-token
            - name: net.dns.refresh
              value: "30"
            - name: net.dns.ttl
              value: "30"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /status-0123456789abcdef
              port: 3939
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status-0123456789abcdef
              port: 3939
            initialDelaySeconds: 10
            periodSeconds: 5
