apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycloak
  namespace: mbd-infra
spec:
  hosts:
    - "keycloak.mbd.local"
  gateways:
    - mbd/mbd-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: keycloak
            port:
              number: 8080
