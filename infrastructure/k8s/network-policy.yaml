apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mbd-network-policy
  namespace: mbd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: mbd
        - namespaceSelector:
            matchLabels:
              name: mbd-infra
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: mbd
        - namespaceSelector:
            matchLabels:
              name: mbd-infra
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
