apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mbd-network-policy
  namespace: mbd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mbd # <--- Aangepast naar het standaard K8s label
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mbd-infra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mbd
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mbd-infra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
