# infrastructure/argocd/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mbd
  namespace: argocd
spec:
  description: MBD Banking Application
  sourceRepos:
    - 'https://github.com/edwinbulter/mbd'
  destinations:
    - namespace: mbd
      server: https://kubernetes.default.svc
    - namespace: mbd-infra
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
