name: CodeQL Security Analysis - Portfolio Service

on:
  workflow_dispatch: {}

jobs:
  codeql-analysis:
    name: CodeQL OWASP Top 10 Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended
          config: |
            paths:
              - backend/portfolio-service
            paths-ignore:
              - backend/portfolio-service/build

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build portfolio-service
        working-directory: backend
        run: ./gradlew :portfolio-service:build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin/portfolio-service"
          output: sarif-results

      - name: Generate Security Report
        if: always()
        run: |
          cat > security-report.md <<'EOF'
          # CodeQL Security Analysis Report

          **Service**: portfolio-service
          **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Scan Status**: ✅ Completed Successfully

          ---

          ## Executive Summary

          EOF

          # Count results
          RESULT_COUNT=$(jq -r '.runs[0].results | length' sarif-results/java.sarif)
          RULES_COUNT=$(jq -r '.runs[0].tool.extensions[] | select(.name == "codeql/java-queries") | .rules | length' sarif-results/java.sarif)
          FILES_COUNT=$(jq -r '.runs[0].artifacts | length' sarif-results/java.sarif)

          if [ "$RESULT_COUNT" -eq 0 ]; then
            cat >> security-report.md <<EOF
          🎉 **No security vulnerabilities detected!**

          - **Security Issues Found**: 0
          - **Security Rules Checked**: $RULES_COUNT
          - **Files Analyzed**: $FILES_COUNT

          ---

          ## OWASP Top 10 Coverage

          All OWASP Top 10 categories were checked:

          ✅ **A01: Broken Access Control** - No issues
          ✅ **A02: Cryptographic Failures** - No issues
          ✅ **A03: Injection** - No issues
          ✅ **A04: Insecure Design** - No issues
          ✅ **A05: Security Misconfiguration** - No issues
          ✅ **A06: Vulnerable Components** - No issues
          ✅ **A07: Authentication Failures** - No issues
          ✅ **A08: Data Integrity Failures** - No issues
          ✅ **A09: Logging Failures** - ℹ️ Not covered by CodeQL
          ✅ **A10: SSRF** - No issues

          ---

          ## Analyzed Files

          EOF
            jq -r '.runs[0].artifacts[].location.uri | select(contains("portfolio-service")) | select(contains(".kt"))' sarif-results/java.sarif | while read file; do
              echo "- \`$file\`" >> security-report.md
            done

            cat >> security-report.md <<'EOF'

          ---

          ## Key Security Checks Performed

          The following critical security checks were performed:

          ### Injection Vulnerabilities
          - SQL Injection (parameterized queries)
          - LDAP Injection
          - XML External Entity (XXE)
          - Command Injection
          - JNDI Injection
          - OGNL Injection

          ### Authentication & Authorization
          - Insecure authentication patterns
          - CSRF protection
          - Session management

          ### Cryptography
          - Weak cryptographic algorithms
          - Predictable random number generators
          - Insecure key storage

          ### Data Handling
          - Unsafe deserialization
          - Path traversal
          - Zip slip vulnerabilities
          - Cleartext storage of sensitive data

          ### Web Security
          - Server-Side Request Forgery (SSRF)
          - Insecure cookie configuration
          - URL redirection vulnerabilities

          ### Message Queue Security
          - Kafka message handling
          - Unsafe deserialization from message queues

          ---

          ## Conclusion

          ✅ The portfolio-service has **passed** the CodeQL security analysis with no vulnerabilities detected.

          ### Recommendations
          - Continue running security scans on code changes
          - Complement with manual security reviews for business logic
          - Consider adding dynamic application security testing (DAST)
          - Review authentication and authorization logic manually
          - Validate Kafka message inputs and implement proper error handling

          ---

          *Generated by CodeQL OWASP Top 10 Analysis Workflow*
          EOF
          else
            cat >> security-report.md <<EOF
          ⚠️ **$RESULT_COUNT security issue(s) detected!**

          - **Security Issues Found**: $RESULT_COUNT
          - **Security Rules Checked**: $RULES_COUNT
          - **Files Analyzed**: $FILES_COUNT

          ---

          ## Findings

          EOF
            jq -r '.runs[0].results[] | "### \(.ruleId)\n\n**Severity**: \(.level)\n\n**Message**: \(.message.text)\n\n**Location**: \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\n\n---\n"' sarif-results/java.sarif >> security-report.md
          fi

          echo "Report generated successfully!"
          cat security-report.md

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-service-security-report
          path: security-report.md
          retention-days: 30

      - name: Upload SARIF as artifact for local analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-service-codeql-sarif
          path: sarif-results/java.sarif
          retention-days: 7
