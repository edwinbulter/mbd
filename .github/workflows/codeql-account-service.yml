name: CodeQL Security Analysis - Account Service

on:
  workflow_dispatch: {}

jobs:
  codeql-analysis:
    name: CodeQL OWASP Top 10 Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended
          config: |
            paths:
              - backend/account-service
            paths-ignore:
              - backend/account-service/build

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build account-service
        working-directory: backend
        run: ./gradlew :account-service:build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
          upload: true
          output: sarif-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results

      - name: Show results summary
        if: always()
        run: |
          echo "CodeQL analysis complete. Check Security tab for detailed findings."
          if [ -d "sarif-results" ]; then
            echo "SARIF files generated:"
            ls -la sarif-results/
          fi
